name: critpath
description: Find out why CI is slow — critical path, queue time and a wall-time budget gate for GitHub Actions.
author: vineetdev02

branding:
  icon: activity
  color: purple

inputs:
  repository:
    description: Repository to analyze, as owner/repo.
    required: false
    default: ${{ github.repository }}
  branch:
    description: Branch to analyze. Defaults to the repository's default branch.
    required: false
    default: ""
  all-branches:
    description: Analyze runs from every branch instead of one.
    required: false
    default: "false"
  workflow:
    description: Workflow file or name. Defaults to the one consuming the most time.
    required: false
    default: ""
  runs:
    description: How many runs to sample (max 100).
    required: false
    default: ""
  event:
    description: Only sample runs from this trigger, e.g. push or pull_request.
    required: false
    default: ""
  budget:
    description: Wall-time budget, e.g. 10m, 90s, 1h30m. A bare number reads as minutes.
    required: false
    default: ""
  job-budget:
    description: >
      Per-job budgets as <job>=<duration>, one per line or separated by commas,
      e.g. "build=5m". Each is checked against that job's p50 across the sample.
    required: false
    default: ""
  check:
    description: Fail the job when a budget is exceeded. No effect without a budget.
    required: false
    default: "true"
  comment:
    description: Post the report on the pull request, updating the previous comment. Needs pull-requests:write.
    required: false
    default: "true"
  summary:
    description: Append the report to the job summary.
    required: false
    default: "true"
  args:
    description: Extra flags passed to critpath verbatim.
    required: false
    default: ""
  token:
    description: Token used to read the runs and to comment.
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the markdown report this run wrote.
    value: ${{ steps.critpath.outputs.report }}
  over-budget:
    description: '"true" when a budget — wall-time or per-job — came out over.'
    value: ${{ steps.critpath.outputs.over-budget }}
  exit-code:
    description: The exit code critpath returned — 0 clean, 1 over budget, 3 could not run.
    value: ${{ steps.critpath.outputs.exit-code }}

runs:
  using: composite
  steps:
    # Inputs arrive as environment variables rather than being interpolated into
    # the script: a branch or workflow name comes from the pull request, and
    # `${{ }}` inside a run block would paste it straight into the shell.
    - id: critpath
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CRITPATH_REPOSITORY: ${{ inputs.repository }}
        CRITPATH_BRANCH: ${{ inputs.branch }}
        CRITPATH_ALL_BRANCHES: ${{ inputs.all-branches }}
        CRITPATH_WORKFLOW: ${{ inputs.workflow }}
        CRITPATH_RUNS: ${{ inputs.runs }}
        CRITPATH_EVENT: ${{ inputs.event }}
        CRITPATH_BUDGET: ${{ inputs.budget }}
        CRITPATH_JOB_BUDGET: ${{ inputs.job-budget }}
        CRITPATH_ARGS: ${{ inputs.args }}
      run: |
        set -u

        if ! command -v node > /dev/null; then
          echo "::error::critpath needs Node. Add actions/setup-node@v4 before this step."
          exit 3
        fi
        major="$(node -p 'process.versions.node.split(".")[0]')"
        if [ "$major" -lt 20 ]; then
          echo "::error::critpath needs Node 20 or newer; this runner has $(node --version)."
          exit 3
        fi

        report="${RUNNER_TEMP:-.}/critpath.md"

        args=()
        [ -n "$CRITPATH_REPOSITORY" ] && args+=("$CRITPATH_REPOSITORY")
        [ -n "$CRITPATH_BRANCH" ] && args+=(--branch "$CRITPATH_BRANCH")
        [ "$CRITPATH_ALL_BRANCHES" = "true" ] && args+=(--all-branches)
        [ -n "$CRITPATH_WORKFLOW" ] && args+=(--workflow "$CRITPATH_WORKFLOW")
        [ -n "$CRITPATH_RUNS" ] && args+=(--runs "$CRITPATH_RUNS")
        [ -n "$CRITPATH_EVENT" ] && args+=(--event "$CRITPATH_EVENT")
        [ -n "$CRITPATH_BUDGET" ] && args+=(--budget "$CRITPATH_BUDGET")
        # One --job-budget, never several: the CLI rejects a repeated one
        # rather than keeping the last, and a multi-line input arrives here as
        # one string that it already knows how to split.
        [ -n "$CRITPATH_JOB_BUDGET" ] && args+=(--job-budget "$CRITPATH_JOB_BUDGET")
        # --check goes in whenever there is a budget of either kind, because
        # the exit code is the only place the verdict is machine-readable — the
        # `check` input decides whether that verdict fails the job, further
        # down. With no budget at all --check is a usage error, so it stays out.
        if [ -n "$CRITPATH_BUDGET" ] || [ -n "$CRITPATH_JOB_BUDGET" ]; then
          args+=(--check)
        fi
        # Word-split on purpose: `args: --all --event push` is a flag list.
        # Globbing is off while it splits, or a `*` in a job name would be
        # expanded against whatever files sit in the workspace.
        if [ -n "$CRITPATH_ARGS" ]; then
          set -f
          # shellcheck disable=SC2206
          args+=($CRITPATH_ARGS)
          set +f
        fi

        # The version comes from the action's own checkout, so `critpath@v0.1.5`
        # runs 0.1.5 and `@main` runs whatever main declares. A hardcoded pin
        # here would keep running the previous release after every bump.
        #
        # The path reaches node through the environment, never pasted into the
        # script: on a Windows runner it is `D:\a\_actions\…\v0.1.9`, and
        # inside a JavaScript string `\v` is a vertical tab — the require
        # failed, and the step died before critpath ever ran.
        version="$(node -p 'require(require("node:path").join(process.env.GITHUB_ACTION_PATH, "package.json")).version')"

        # Installed into a directory of its own, rather than run through
        # `npx critpath@…`. npx resolves a spec against the *current project*
        # before the registry, so in a repository that is itself critpath —
        # this one, dogfooding — it decides the local checkout already
        # satisfies the spec, never downloads anything, and then finds no
        # binary to run because nothing built dist: `sh: 1: critpath: not
        # found`, exit 127. `--package` does not change that; only leaving the
        # directory does, and the directory has to stay, because critpath
        # reads the git remote of the working directory when none is given.
        install="$(mktemp -d)"
        if ! npm install --no-save --no-audit --no-fund --prefix "$install" "critpath@$version" > /dev/null; then
          echo "::error::could not install critpath@$version from the registry."
          exit 3
        fi

        # `shell: bash` in a composite action is `bash --noprofile --norc -eo
        # pipefail`, so a non-zero exit ends the step before the next line
        # runs. `|| code=$?` is what lets the verdict reach the outputs below:
        # without it `check: false` could never suppress anything and
        # `over-budget` could never be true, because exit 1 killed the step
        # rather than being read.
        #
        # `${args[@]+…}` rather than "${args[@]}": with no inputs set the array
        # is empty, and bash before 4.4 — macOS's /bin/bash is 3.2 — treats an
        # empty array as unbound under `set -u`.
        code=0
        "$install/node_modules/.bin/critpath" ${args[@]+"${args[@]}"} --markdown > "$report" || code=$?

        # Every markdown report opens with the comment marker, so a report
        # without one means nothing was written and the verdict below would be
        # invented — the false positive this tool exists not to produce.
        if [ "$code" -le 1 ] && ! grep -q '<!-- critpath -->' "$report"; then
          echo "::error::critpath@$version wrote no report — see the log above."
          exit 3
        fi

        {
          echo "report=$report"
          echo "exit-code=$code"
          echo "over-budget=$([ "$code" -eq 1 ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

        # 2 is bad usage and 3 is could not run: critpath has already said why
        # on stderr, and there is no report to publish.
        if [ "$code" -ge 2 ]; then
          exit "$code"
        fi

    - if: ${{ inputs.summary == 'true' }}
      shell: bash
      env:
        CRITPATH_REPORT: ${{ steps.critpath.outputs.report }}
      run: cat "$CRITPATH_REPORT" >> "$GITHUB_STEP_SUMMARY"

    # One comment per pull request, edited in place. The marker in critpath's
    # markdown is what finds the previous one, so a rerun replaces its own
    # comment instead of stacking a new one on every push.
    - if: ${{ inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CRITPATH_REPORT: ${{ steps.critpath.outputs.report }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -u

        for tool in gh jq; do
          if ! command -v "$tool" > /dev/null; then
            echo "::warning::$tool is not installed, so the report was not posted on the pull request."
            exit 0
          fi
        done

        comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
        body="$(mktemp)"
        jq -Rs '{ body: . }' < "$CRITPATH_REPORT" > "$body"

        # Only a comment this token wrote, and only one that opens with the
        # marker every report opens with. Anyone can post a comment that merely
        # contains the marker; matching on that edited a stranger's comment, or
        # failed outright on one the token may not touch. A personal token
        # answers /user with its login; the workflow token cannot, and writes
        # as a bot.
        login="$(gh api user --jq .login 2> /dev/null || true)"
        existing="$(gh api "$comments" --paginate 2> /dev/null \
          | jq -r --arg login "$login" '.[]
              | select((.body // "") | startswith("<!-- critpath -->"))
              | select(if $login != "" then .user.login == $login else .user.type == "Bot" end)
              | .id' 2> /dev/null \
          | tail -n 1 || true)"

        if [ -n "$existing" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input "$body" > /dev/null; then
          exit 0
        fi

        # A pull request from a fork gets a read-only token, so the comment is
        # refused there. That says nothing about CI speed: the report is still
        # in the step's `report` output and, by default, the job summary, and
        # failing the job over it turned every outside contribution red.
        if ! gh api -X POST "$comments" --input "$body" > /dev/null; then
          echo "::warning::critpath could not comment on pull request #$PR_NUMBER. The token cannot write there, which is normal for a pull request from a fork."
        fi

    # Failing last, so the report reaches the pull request even when the budget
    # blew: a red job with no explanation is what gets muted.
    - if: ${{ steps.critpath.outputs.over-budget == 'true' && inputs.check == 'true' }}
      shell: bash
      run: |
        echo "::error::critpath: a budget was exceeded — see the report."
        exit 1
